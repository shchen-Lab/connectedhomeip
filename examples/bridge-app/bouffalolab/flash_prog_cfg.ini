[cfg]
erase = 2
skip_mode = 0x0, 0x0
boot2_isp_mode = 0

[boot2]
filedir = ./build/build_out/boot2_*.bin
address = 0x000000

[partition]
filedir = ./build/build_out/partition*.bin
address = 0xE000

[FW]
filedir = ./build/build_out/chip-bflb-bridge-example_$(CHIPNAME)*.bin
address = @partition

# To flash a Matter factory-data bin into the [mfg] partition, run
# `make flash MFD_FILE=path/to/factory.bin`.
